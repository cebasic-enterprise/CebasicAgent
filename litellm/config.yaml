# CeBasic Agent — LiteLLM Proxy
# LibreChat -> LiteLLM (claves virtuales, presupuestos, logs) -> OpenRouter
# Ids de OpenRouter verificados en https://openrouter.ai/api/v1/models (2026-11-23).
# `model_name` es el alias que ve LibreChat; cambia el modelo real aquí sin tocar LibreChat.

model_list:
  - model_name: claude-sonnet
    litellm_params:
      model: openrouter/anthropic/claude-sonnet-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: claude-haiku
    litellm_params:
      model: openrouter/anthropic/claude-haiku-5.5
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt
    litellm_params:
      model: openrouter/openai/gpt-6.2-sol
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gpt-luna
    litellm_params:
      model: openrouter/openai/gpt-6-luna
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: gemini-flash
    litellm_params:
      model: openrouter/google/gemini-3.8-flash
      api_key: os.environ/OPENROUTER_API_KEY

litellm_settings:
  drop_params: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
